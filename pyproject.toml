[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-agent"
version = "0.1.0"
description = "Agentic OCR with capability and memory reflection"
requires-python = ">=3.10"
dependencies = ["Pillow>=9.0", "pandas>=1.5", "pyarrow>=10.0"]

[tool.setuptools.packages.find]
include = ["ocr_agent*"]
